# Harness control file, never shown to the model. Applied once per turn, before the first model call.
# skills: single lowercase trigger words (matched exactly, so list plurals separately) pre-read a
#   skill, capped by max_skills.
# tools: a tool is enabled without reading a skill when its condition holds for the user.
max_skills: 2
skills:
  - skill: answering-document-questions
    triggers: [what, who, when, where, why, how, which, explain, define, describe, tell, about, list, give, show, document, documents, pdf, page]
tools:
  - tool: retrieve_documents
    when: library_has_documents
